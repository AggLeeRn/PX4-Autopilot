<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Telemetrie</title>
<style>
:root {
  color-scheme: light;
  --plane:        #f9f9f7;
  --surface-1:    #fcfcfb;
  --text-primary: #0b0b0b;
  --text-secondary:#52514e;
  --text-muted:   #898781;
  --grid:         #e1e0d9;
  --axis:         #c3c2b7;
  --border:       rgba(11,11,11,0.10);
  --series-1:     #2a78d6;
  --series-2:     #eb6834;
  --series-3:     #1baf7a;
  --series-4:     #b57edc;
  --seq-250:      #86b6ef;
  --seq-100:      #cde2fb;
  --seq-600:      #184f95;
  --good:         #0ca30c;
  --warning:      #fab219;
  --critical:     #d03b3b;
  --ground:       #8a6a4a;
}
:root[data-theme="dark"], :root:where(:not([data-theme="light"])) {
  /* prepsano nize podle media query / prepinace */
}
@media (prefers-color-scheme: dark) {
  :root:where(:not([data-theme="light"])) {
    color-scheme: dark;
    --plane:        #0d0d0d;
    --surface-1:    #1a1a19;
    --text-primary: #ffffff;
    --text-secondary:#c3c2b7;
    --text-muted:   #898781;
    --grid:         #2c2c2a;
    --axis:         #383835;
    --border:       rgba(255,255,255,0.10);
    --series-1:     #3987e5;
    --series-2:     #d95926;
    --series-3:     #199e70;
    --series-4:     #a56fce;
    --seq-250:      #256abf;
    --seq-100:      #184f95;
    --seq-600:      #86b6ef;
    --ground:       #6b5238;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --plane:        #0d0d0d;
  --surface-1:    #1a1a19;
  --text-primary: #ffffff;
  --text-secondary:#c3c2b7;
  --text-muted:   #898781;
  --grid:         #2c2c2a;
  --axis:         #383835;
  --border:       rgba(255,255,255,0.10);
  --series-1:     #3987e5;
  --series-2:     #d95926;
  --series-3:     #199e70;
  --series-4:     #a56fce;
  --seq-250:      #256abf;
  --seq-100:      #184f95;
  --seq-600:      #86b6ef;
  --ground:       #6b5238;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--plane);
  color: var(--text-primary);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: 20px 22px 48px;
}

/* ---------- hlavicka ---------- */
header { display: flex; flex-wrap: wrap; align-items: baseline; gap: 16px; margin-bottom: 4px; }
h1 { font-size: 17px; font-weight: 600; margin: 0; letter-spacing: -0.01em; }
.status { display: inline-flex; align-items: center; gap: 7px; font-size: 13px; color: var(--text-secondary); }
.status .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--text-muted); flex: none; }
.status[data-state="live"] .dot { background: var(--good); }
.status[data-state="wait"] .dot { background: var(--warning); }
.status[data-state="down"] .dot { background: var(--critical); }
.status[data-state="paused"] .dot { background: var(--text-muted); }
.meta { margin-left: auto; display: flex; gap: 18px; font-size: 13px; color: var(--text-secondary); }
.meta b { font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; }

/* ---------- radek filtru ---------- */
.controls {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 12px 0 16px; margin-bottom: 14px;
  border-bottom: 1px solid var(--border);
}
.controls .label { font-size: 13px; color: var(--text-secondary); margin-right: 2px; }
button {
  font: inherit; font-size: 13px; color: var(--text-secondary);
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 7px; padding: 5px 11px; cursor: pointer;
}
button:hover { background: color-mix(in srgb, var(--text-primary) 5%, var(--surface-1)); }
button[aria-pressed="true"] { color: var(--text-primary); font-weight: 600; border-color: var(--axis); }
.spacer { margin-left: auto; }

/* ---------- karty ---------- */
.card {
  background: var(--surface-1); border: 1px solid var(--border);
  border-radius: 12px; padding: 14px 16px 12px;
}
.card h2 {
  font-size: 12px; font-weight: 600; margin: 0 0 2px; letter-spacing: 0.01em;
  color: var(--text-secondary);
}
.card .sub { font-size: 11px; color: var(--text-muted); margin: 0 0 10px; }

/* ---------- statove dlazdice ---------- */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; margin-bottom: 14px; }
.tile .val { font-size: 26px; font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; }
.tile .val .u { font-size: 13px; font-weight: 500; color: var(--text-muted); margin-left: 3px; letter-spacing: 0; }
.tile canvas { display: block; width: 100%; height: 26px; margin-top: 8px; }
.meter { height: 6px; border-radius: 3px; background: var(--seq-100); margin-top: 10px; overflow: hidden; }
.meter i { display: block; height: 100%; border-radius: 3px; background: var(--series-1); }

/* ---------- pristroje ---------- */
.instruments { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 12px; margin-bottom: 14px; }
.inst-body { display: flex; align-items: center; gap: 14px; }
.inst-body canvas { flex: none; }
.readout { font-size: 12px; color: var(--text-secondary); }
.readout div { margin-bottom: 4px; }
.readout b { color: var(--text-primary); font-weight: 600; font-variant-numeric: tabular-nums; }

/* ---------- grafy ---------- */
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(380px, 1fr)); gap: 12px; }
.plot { position: relative; }
.plot canvas { display: block; width: 100%; height: 196px; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; margin: 0 0 8px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-secondary); }
.legend i { width: 14px; height: 2px; border-radius: 1px; flex: none; }
.tip {
  position: absolute; pointer-events: none; opacity: 0; transition: opacity .1s;
  background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px;
  padding: 7px 9px; font-size: 12px; box-shadow: 0 4px 14px rgba(0,0,0,.13); z-index: 5;
  min-width: 108px;
}
.tip .th { color: var(--text-muted); font-size: 11px; margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.tip .r { display: flex; align-items: center; gap: 7px; white-space: nowrap; }
.tip .r i { width: 10px; height: 2px; border-radius: 1px; flex: none; }
.tip .r b { font-weight: 600; color: var(--text-primary); font-variant-numeric: tabular-nums; margin-left: auto; }
.tip .r span { color: var(--text-secondary); }

/* ---------- tabulka ---------- */
#tableCard { margin-top: 14px; }
table { border-collapse: collapse; width: 100%; font-size: 13px; }
th, td { text-align: right; padding: 6px 10px; border-bottom: 1px solid var(--grid); font-variant-numeric: tabular-nums; }
th { color: var(--text-muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: .04em; }
th:first-child, td:first-child { text-align: left; font-variant-numeric: normal; }
td:first-child { color: var(--text-secondary); }
td b { font-weight: 600; }
.empty { color: var(--text-muted); font-size: 13px; padding: 28px 0; text-align: center; }
[hidden] { display: none !important; }
</style>
</head>
<body>

<header>
  <h1>Telemetrie</h1>
  <span class="status" id="status" data-state="wait"><span class="dot"></span><span id="statusText">Čekám na data…</span></span>
  <div class="meta">
    <span>Vzorků <b id="mCount">0</b></span>
    <span>Frekvence <b id="mRate">0,0</b> Hz</span>
    <span>Doba <b id="mElapsed">0:00</b></span>
  </div>
</header>

<div class="controls">
  <span class="label">Okno</span>
  <button data-win="30" aria-pressed="false">30 s</button>
  <button data-win="120" aria-pressed="true">2 min</button>
  <button data-win="600" aria-pressed="false">10 min</button>
  <button data-win="0" aria-pressed="false">Celý let</button>
  <span class="spacer"></span>
  <button id="btnPause" aria-pressed="false">Pozastavit</button>
  <button id="btnTable" aria-pressed="false">Tabulka</button>
  <button id="btnTheme">Motiv</button>
</div>

<section class="tiles" id="tiles"></section>
<section class="instruments" id="instruments"></section>
<section class="charts" id="charts"></section>

<section class="card" id="tableCard" hidden>
  <h2>Všechny kanály</h2>
  <p class="sub">Aktuální hodnota a rozsah za zvolené okno — stejná data jako v grafech, bez závislosti na barvě.</p>
  <div style="overflow-x:auto">
    <table>
      <thead><tr><th>Kanál</th><th>Aktuální</th><th>Min</th><th>Max</th><th>Průměr</th><th>Vzorků</th></tr></thead>
      <tbody id="tableBody"></tbody>
    </table>
  </div>
</section>

<script>
"use strict";

/* ============================ metadata kanalu ============================ */
const CH = {
  RxBt: {label: "Napětí přijímače", unit: "V",   dec: 2},
  Curr: {label: "Proud",            unit: "A",   dec: 1},
  Capa: {label: "Odebraná kapacita",unit: "mAh", dec: 0},
  Alt:  {label: "Výška",            unit: "m",   dec: 1},
  GAlt: {label: "Výška GPS",        unit: "m",   dec: 1},
  VSpd: {label: "Vertikální rychlost", unit: "m/s", dec: 2},
  GSpd: {label: "Rychlost",         unit: "km/h",dec: 1},
  Hdg:  {label: "Kurz",             unit: "°",   dec: 0},
  Sats: {label: "Satelity",         unit: "",    dec: 0},
  RQly: {label: "Kvalita příjmu",   unit: "%",   dec: 0},
  TQly: {label: "Kvalita vysílání", unit: "%",   dec: 0},
  TRSS: {label: "RSSI vysílače",    unit: "dBm", dec: 0},
  TSNR: {label: "SNR vysílače",     unit: "dB",  dec: 0},
  TPWR: {label: "Výkon vysílače",   unit: "mW",  dec: 0},
  "1RSS": {label: "RSSI anténa 1",  unit: "dBm", dec: 0},
  "2RSS": {label: "RSSI anténa 2",  unit: "dBm", dec: 0},
  RSSI: {label: "RSSI",             unit: "dBm", dec: 0},
  Ptch: {label: "Pitch",            unit: "rad", dec: 3},
  Roll: {label: "Roll",             unit: "rad", dec: 3},
  Yaw:  {label: "Yaw",              unit: "rad", dec: 3},
  lat:  {label: "Zeměpisná šířka",  unit: "°",   dec: 6},
  lon:  {label: "Zeměpisná délka",  unit: "°",   dec: 6},
  t:    {label: "Čas rádia",        unit: "×10 ms", dec: 0},
  GPS:  {label: "GPS",              unit: "",    dec: 0},
  cmd_roll:  {label: "Roll (páka)",   unit: "%", dec: 0},
  cmd_pitch: {label: "Pitch (páka)",  unit: "%", dec: 0},
  cmd_yaw:   {label: "Yaw (páka)",    unit: "%", dec: 0},
  cmd_thr:   {label: "Plyn (páka)",   unit: "%", dec: 0},
  Roll_deg:  {label: "Roll",         unit: "°", dec: 1},
  Ptch_deg:  {label: "Pitch",        unit: "°", dec: 1},
  Yaw_deg:   {label: "Yaw",          unit: "°", dec: 0},
  cmd_roll_deg:  {label: "Roll zadané",  unit: "°", dec: 1},
  cmd_pitch_deg: {label: "Pitch zadané", unit: "°", dec: 1},
  err_roll:  {label: "Roll chyba",   unit: "°", dec: 1},
  err_pitch: {label: "Pitch chyba",  unit: "°", dec: 1},
  tilt_act:  {label: "Celkový náklon (skut.)", unit: "°", dec: 1},
  tilt_cmd:  {label: "Celkový náklon (zad.)",  unit: "°", dec: 1},
};

/* ===== prevod packa -> uhel (uprav podle sveho dronu) ===== */
const ANGLE_MAX = 45;    // ArduPilot ANGLE_MAX ve stupnich (4500 = 45)
const ACT_RAD   = true;  // skutecna attitude z CRSF je v radianech (jinak dej false)

// Smer naklonu ve vizualizacich (prehod 1 <-> -1, kdyz je osa zrcadlove).
// Zvlast pro ZADANE (packy) a SKUTECNE (dron) - mivaji opacnou konvenci.
const SIGN_CMD_ROLL  = 1;    // zadane (packy): naklon
const SIGN_CMD_PITCH = -1;   // zadane (packy): sklon
const SIGN_ACT_ROLL  = 1;   // skutecne (dron): naklon
const SIGN_ACT_PITCH = 1;    // skutecne (dron): sklon

// Horizont: jak se ma naklanet u rollu vuci modelu dronu.
//   true  = kokpitovy (naklani se OPACNE nez model, jako umely horizont v letadle)
//   false = naklani se STEJNE jako model (pohled zvenci / FPV)
const HORIZON_ADI = true;

const meta = k => CH[k] || {label: k, unit: "", dec: 2};

/* ================================ stav ================================== */
const S = {
  samples: [],
  keys: [],
  window: 120,     // sekundy; 0 = vse
  paused: false,
  connected: false,
  lastRx: 0,
  t0: 0,
};

const fmt = (v, d) => v == null || !isFinite(v) ? "—"
  : v.toFixed(d).replace(".", ",");
const clock = ts => new Date(ts * 1000).toLocaleTimeString("cs-CZ", {hour12: false});

function tok(name) {
  return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
}

/** Vzorky ve zvolenem casovem okne. */
function windowed() {
  const n = S.samples.length;
  if (!n) return [];
  if (!S.window) return S.samples;
  const cut = S.samples[n - 1]._ts - S.window;
  let lo = 0, hi = n;
  while (lo < hi) { const m = (lo + hi) >> 1; if (S.samples[m]._ts < cut) lo = m + 1; else hi = m; }
  return S.samples.slice(lo);
}

const latest = () => S.samples.length ? S.samples[S.samples.length - 1] : {};
function val(key) { const v = latest()[key]; return typeof v === "number" && isFinite(v) ? v : null; }

/* ============================ kresleni: zaklad ========================== */
function fitCanvas(cv) {
  const dpr = window.devicePixelRatio || 1;
  const r = cv.getBoundingClientRect();
  const w = Math.max(1, Math.round(r.width)), h = Math.max(1, Math.round(r.height));
  if (cv.width !== w * dpr || cv.height !== h * dpr) { cv.width = w * dpr; cv.height = h * dpr; }
  const g = cv.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  return {g, w, h};
}

/** Hezke kulate hodnoty na ose. */
function niceScale(min, max, count) {
  if (!isFinite(min) || !isFinite(max)) return {lo: 0, hi: 1, ticks: [0, 1]};
  if (min === max) { const p = Math.abs(min) * 0.1 || 1; min -= p; max += p; }
  const raw = (max - min) / Math.max(1, count);
  const mag = Math.pow(10, Math.floor(Math.log10(raw)));
  const norm = raw / mag;
  const step = (norm <= 1 ? 1 : norm <= 2 ? 2 : norm <= 5 ? 5 : 10) * mag;
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step;
  const ticks = [];
  for (let v = lo; v <= hi + step * 0.5; v += step) ticks.push(Math.round(v / step) * step);
  return {lo, hi, ticks};
}

/* ============================== carovy graf ============================= */
class LineChart {
  constructor(cfg) {
    this.cfg = cfg;                   // {title, sub, series:[{key,label,varName}], unit, dec}
    const card = document.createElement("section");
    card.className = "card plot";
    const multi = cfg.series.length > 1;
    card.innerHTML =
      '<h2></h2><p class="sub"></p>' +
      (multi ? '<div class="legend"></div>' : "") +
      '<canvas></canvas><div class="tip"></div>';
    card.querySelector("h2").textContent = cfg.title;
    card.querySelector(".sub").textContent = cfg.sub || "";
    this.el = card;
    this.cv = card.querySelector("canvas");
    this.tip = card.querySelector(".tip");
    if (multi) {
      const lg = card.querySelector(".legend");
      cfg.series.forEach(s => {
        const sp = document.createElement("span");
        const i = document.createElement("i");
        i.style.background = `var(${s.varName})`;
        sp.appendChild(i);
        sp.appendChild(document.createTextNode(s.label));   // popisky jako text, ne innerHTML
        lg.appendChild(sp);
      });
    }
    this.hover = null;
    this.cv.addEventListener("pointermove", e => {
      const r = this.cv.getBoundingClientRect();
      this.hover = {x: e.clientX - r.left, y: e.clientY - r.top};
      this.draw();
    });
    this.cv.addEventListener("pointerleave", () => { this.hover = null; this.tip.style.opacity = 0; this.draw(); });
  }

  draw() {
    const {g, w, h} = fitCanvas(this.cv);
    const data = windowed();
    const cfg = this.cfg;
    const cols = cfg.series.map(s => ({...s, color: tok(s.varName)}));
    const PL = 54, PR = 74, PT = 10, PB = 24;      // misto vpravo pro koncovy popisek
    const iw = w - PL - PR, ih = h - PT - PB;
    const muted = tok("--text-muted"), grid = tok("--grid"), axis = tok("--axis");
    const ink = tok("--text-primary"), surface = tok("--surface-1");
    g.font = '11px system-ui, -apple-system, "Segoe UI", sans-serif';

    // body jednotlivych rad
    const pts = cols.map(s => data
      .map(d => ({t: d._ts, v: d[s.key]}))
      .filter(p => typeof p.v === "number" && isFinite(p.v)));
    const any = pts.some(p => p.length);
    if (!any || iw <= 0) {
      g.fillStyle = muted; g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText("čekám na data", w / 2, h / 2);
      return;
    }

    const t1 = data[data.length - 1]._ts;
    const t0 = S.window ? t1 - S.window : data[0]._ts;
    const span = Math.max(t1 - t0, 1e-3);

    let mn = Infinity, mx = -Infinity;
    pts.forEach(ps => ps.forEach(p => { if (p.v < mn) mn = p.v; if (p.v > mx) mx = p.v; }));
    if (cfg.zeroBase && mn > 0) mn = 0;
    if (cfg.pad) { mn -= cfg.pad; mx += cfg.pad; }
    let sc;
    if (cfg.fixed) {                                   // pevna stupnice (napr. 0-100 %)
      const [lo, hi, st] = cfg.fixed, ticks = [];
      for (let v = lo; v <= hi + st * 0.5; v += st) ticks.push(v);
      sc = {lo, hi, ticks};
    } else {
      sc = niceScale(mn, mx, 4);
    }
    const X = t => PL + ((t - t0) / span) * iw;
    const Y = v => PT + ih - ((v - sc.lo) / (sc.hi - sc.lo || 1)) * ih;

    // mrizka - vlasove, plne, potlacene
    g.lineWidth = 1; g.strokeStyle = grid; g.fillStyle = muted;
    g.textAlign = "right"; g.textBaseline = "middle";
    sc.ticks.forEach(v => {
      const y = Math.round(Y(v)) + 0.5;
      g.beginPath(); g.moveTo(PL, y); g.lineTo(PL + iw, y); g.stroke();
      g.fillText(fmt(v, sc.ticks.some(t => Math.abs(t % 1) > 1e-9) ? Math.max(cfg.dec, 1) : 0), PL - 8, y);
    });
    // osa X
    g.strokeStyle = axis;
    const yb = Math.round(PT + ih) + 0.5;
    g.beginPath(); g.moveTo(PL, yb); g.lineTo(PL + iw, yb); g.stroke();
    g.textBaseline = "top"; g.fillStyle = muted;
    [0, 0.5, 1].forEach((f, i) => {
      g.textAlign = i === 0 ? "left" : i === 2 ? "right" : "center";
      g.fillText(clock(t0 + f * span), PL + f * iw, PT + ih + 7);
    });

    // cary 2px, kulate spoje
    g.lineJoin = "round"; g.lineCap = "round"; g.lineWidth = 2;
    pts.forEach((ps, i) => {
      if (!ps.length) return;
      g.strokeStyle = cols[i].color;
      g.beginPath();
      ps.forEach((p, j) => { const x = X(p.t), y = Y(p.v); j ? g.lineTo(x, y) : g.moveTo(x, y); });
      g.stroke();
    });

    // koncovy bod + primy popisek (text v barve inkoustu, identitu nese tecka)
    const labels = [];
    pts.forEach((ps, i) => {
      if (!ps.length) return;
      const p = ps[ps.length - 1], x = X(p.t), y = Y(p.v);
      g.beginPath(); g.arc(x, y, 4, 0, 7);
      g.fillStyle = cols[i].color; g.fill();
      g.lineWidth = 2; g.strokeStyle = surface; g.stroke();   // 2px prstenec v barve podkladu
      labels.push({y, y0: y, v: p.v, c: cols[i].color, x});
    });
    labels.sort((a, b) => a.y - b.y);
    for (let i = 1; i < labels.length; i++)                    // popisky se nesmi prekryt
      if (labels[i].y - labels[i - 1].y < 14) labels[i].y = labels[i - 1].y + 14;
    g.textAlign = "left"; g.textBaseline = "middle";
    labels.forEach(l => {
      const lx = Math.min(l.x, PL + iw) + 10;
      if (Math.abs(l.y - l.y0) > 1) {                          // odsunuty popisek nese vodici carku
        g.lineWidth = 1; g.strokeStyle = tok("--axis");
        g.beginPath(); g.moveTo(l.x + 5, l.y0); g.lineTo(lx, l.y); g.stroke();
      }
      g.beginPath(); g.arc(lx + 3, l.y, 3, 0, 7); g.fillStyle = l.c; g.fill();
      g.fillStyle = ink;
      g.fillText(fmt(l.v, cfg.dec) + (cfg.unit ? " " + cfg.unit : ""), lx + 10, l.y);
    });

    // zamerny kriz + bublina
    if (this.hover && this.hover.x >= PL && this.hover.x <= PL + iw) {
      const ht = t0 + ((this.hover.x - PL) / iw) * span;
      let best = null, bd = Infinity;
      data.forEach(d => { const dd = Math.abs(d._ts - ht); if (dd < bd) { bd = dd; best = d; } });
      if (best) {
        const x = Math.round(X(best._ts)) + 0.5;
        g.lineWidth = 1; g.strokeStyle = axis;
        g.beginPath(); g.moveTo(x, PT); g.lineTo(x, PT + ih); g.stroke();
        this.showTip(best, x, cols);
      }
    } else {
      this.tip.style.opacity = 0;
    }
  }

  showTip(d, x, cols) {
    const cfg = this.cfg, tip = this.tip;
    tip.textContent = "";
    const th = document.createElement("div");
    th.className = "th";
    th.textContent = clock(d._ts);
    tip.appendChild(th);
    cols.forEach(s => {
      const v = d[s.key];
      if (typeof v !== "number" || !isFinite(v)) return;
      const r = document.createElement("div"); r.className = "r";
      const i = document.createElement("i"); i.style.background = s.color;
      const nm = document.createElement("span"); nm.textContent = s.label;
      const b = document.createElement("b"); b.textContent = fmt(v, cfg.dec) + (cfg.unit ? " " + cfg.unit : "");
      r.append(i, nm, b);
      tip.appendChild(r);
    });
    tip.style.opacity = 1;
    const wc = this.cv.getBoundingClientRect().width;
    const tw = tip.offsetWidth;
    tip.style.left = Math.max(4, Math.min(x + 14, wc - tw - 4)) + "px";
    tip.style.top = "30px";
  }
}

/* ============================== dlazdice =============================== */
class Tile {
  constructor(cfg) {                                 // {key, label, unit, dec, meter?}
    this.cfg = cfg;
    const c = document.createElement("section");
    c.className = "card tile";
    c.innerHTML = '<h2></h2><div class="val"><span class="n">—</span><span class="u"></span></div>'
      + (cfg.meter ? '<div class="meter"><i></i></div>' : '<canvas></canvas>');
    c.querySelector("h2").textContent = cfg.label;
    c.querySelector(".u").textContent = cfg.unit;
    this.el = c;
    this.n = c.querySelector(".n");
    this.cv = c.querySelector("canvas");
    this.bar = c.querySelector(".meter i");
  }
  draw() {
    const v = val(this.cfg.key);
    this.n.textContent = fmt(v, this.cfg.dec);
    if (this.bar) {
      const pct = Math.max(0, Math.min(100, v == null ? 0 : v));
      this.bar.style.width = pct + "%";
      // vypln nese zavaznost; hodnota v procentech je vzdy i v textu vedle
      this.bar.style.background = pct >= 70 ? "var(--series-1)"
        : pct >= 40 ? "var(--warning)" : "var(--critical)";
      return;
    }
    // jiskrova cara: prubeh potlacenym odstinem, aktualni bod akcentem
    const {g, w, h} = fitCanvas(this.cv);
    const data = windowed().map(d => d[this.cfg.key]).filter(x => typeof x === "number" && isFinite(x));
    if (data.length < 2) return;
    const step = Math.max(1, Math.floor(data.length / w));
    const pts = data.filter((_, i) => i % step === 0);
    let mn = Math.min(...pts), mx = Math.max(...pts);
    if (mn === mx) { mn -= 1; mx += 1; }
    const X = i => (i / (pts.length - 1)) * (w - 6) + 3;
    const Y = v => h - 3 - ((v - mn) / (mx - mn)) * (h - 6);
    g.lineWidth = 2; g.lineJoin = "round"; g.lineCap = "round";
    g.strokeStyle = tok("--seq-250");
    g.beginPath();
    pts.forEach((v, i) => { i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)); });
    g.stroke();
    g.beginPath(); g.arc(X(pts.length - 1), Y(pts[pts.length - 1]), 3, 0, 7);
    g.fillStyle = tok("--series-1"); g.fill();
  }
}

/* ============================ umely horizont =========================== */
class Horizon {
  constructor() {
    const c = document.createElement("section");
    c.className = "card";
    c.innerHTML = '<h2>Poloha</h2><p class="sub">Skutečný roll (plná) vs zadaný pákami (čárkovaně)</p>'
      + '<div class="inst-body"><canvas width="150" height="150" style="width:150px;height:150px"></canvas>'
      + '<div class="readout"><div>Pitch <b class="p">—</b>°</div><div>Roll <b class="r">—</b>°</div>'
      + '<div>Yaw <b class="y">—</b>°</div>'
      + '<div style="margin-top:6px;color:var(--series-2)">Zadané pákami</div>'
      + '<div>Pitch <b class="cp">—</b>°</div><div>Roll <b class="cr">—</b>°</div></div></div>';
    this.el = c; this.cv = c.querySelector("canvas");
    this.op = c.querySelector(".p"); this.or = c.querySelector(".r"); this.oy = c.querySelector(".y");
    this.ocp = c.querySelector(".cp"); this.ocr = c.querySelector(".cr");
  }
  draw() {
    const p = val("Ptch_deg") ?? 0, r = val("Roll_deg") ?? 0, y = val("Yaw_deg") ?? 0;
    const cr = val("cmd_roll_deg"), cp = val("cmd_pitch_deg");
    const hasCmd = cr != null && cp != null;
    this.op.textContent = fmt(p, 1); this.or.textContent = fmt(r, 1); this.oy.textContent = fmt(y, 1);
    this.ocp.textContent = hasCmd ? fmt(cp, 1) : "—"; this.ocr.textContent = hasCmd ? fmt(cr, 1) : "—";
    const {g, w, h} = fitCanvas(this.cv);
    const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 4, ppd = R / 45;
    g.save();
    g.beginPath(); g.arc(cx, cy, R, 0, 7); g.clip();
    // skutecny horizont (plny)
    g.save();
    g.translate(cx, cy); g.rotate((HORIZON_ADI ? -1 : 1) * r * Math.PI / 180); g.translate(0, p * ppd);
    g.fillStyle = tok("--seq-250"); g.fillRect(-2 * R, -3 * R, 4 * R, 3 * R);      // obloha
    g.fillStyle = tok("--ground");  g.fillRect(-2 * R, 0, 4 * R, 3 * R);           // zeme
    g.strokeStyle = tok("--surface-1"); g.lineWidth = 2;
    g.beginPath(); g.moveTo(-2 * R, 0); g.lineTo(2 * R, 0); g.stroke();            // horizont
    g.lineWidth = 1;
    for (let a = -30; a <= 30; a += 10) {                                          // zebrik sklonu
      if (!a) continue;
      const yy = a * ppd, ln = a % 20 ? R * 0.16 : R * 0.3;
      g.beginPath(); g.moveTo(-ln, yy); g.lineTo(ln, yy); g.stroke();
    }
    g.restore();
    // zadany horizont podle pacek (carkovane)
    if (hasCmd) {
      g.save();
      g.translate(cx, cy); g.rotate((HORIZON_ADI ? -1 : 1) * cr * Math.PI / 180); g.translate(0, cp * ppd);
      g.strokeStyle = tok("--series-2"); g.lineWidth = 2; g.setLineDash([5, 4]);
      g.beginPath(); g.moveTo(-1.6 * R, 0); g.lineTo(1.6 * R, 0); g.stroke();
      g.setLineDash([]);
      g.restore();
    }
    g.restore();
    g.strokeStyle = tok("--axis"); g.lineWidth = 1;
    g.beginPath(); g.arc(cx, cy, R, 0, 7); g.stroke();
    g.strokeStyle = tok("--text-primary"); g.lineWidth = 2;                        // znacka letadla
    g.beginPath();
    g.moveTo(cx - R * 0.4, cy); g.lineTo(cx - R * 0.12, cy);
    g.moveTo(cx + R * 0.12, cy); g.lineTo(cx + R * 0.4, cy);
    g.moveTo(cx, cy - 3); g.lineTo(cx, cy + 3);
    g.stroke();
  }
}

class TiltDisc {
  constructor() {
    const c = document.createElement("section");
    c.className = "card";
    c.innerHTML = '<h2>Kam se naklonit</h2><p class="sub">Pohled shora — skutečný náklon (plný bod) vs zadaný pákami (kroužek)</p>'
      + '<div class="inst-body"><canvas width="150" height="150" style="width:150px;height:150px"></canvas>'
      + '<div class="readout"><div>Δ roll <b class="dr">—</b>°</div><div>Δ pitch <b class="dp">—</b>°</div>'
      + '<div style="color:var(--text-muted);margin-top:6px">rozdíl zadané − skutečné</div></div></div>';
    this.el = c; this.cv = c.querySelector("canvas");
    this.dr = c.querySelector(".dr"); this.dp = c.querySelector(".dp");
  }
  draw() {
    const ra = val("Roll_deg") ?? 0, pa = val("Ptch_deg") ?? 0;
    const rc = val("cmd_roll_deg"), pc = val("cmd_pitch_deg");
    const hasCmd = rc != null && pc != null;
    this.dr.textContent = hasCmd ? fmt(rc - ra, 1) : "—";
    this.dp.textContent = hasCmd ? fmt(pc - pa, 1) : "—";
    const {g, w, h} = fitCanvas(this.cv);
    const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 4, sc = R / ANGLE_MAX;
    const clamp = v => Math.max(-ANGLE_MAX, Math.min(ANGLE_MAX, v));
    const px = (roll, pitch) => ({x: cx + clamp(roll) * sc, y: cy + clamp(pitch) * sc});
    g.strokeStyle = tok("--grid"); g.lineWidth = 1;
    [1 / 3, 2 / 3, 1].forEach(f => { g.beginPath(); g.arc(cx, cy, R * f, 0, 7); g.stroke(); });
    g.strokeStyle = tok("--axis");
    g.beginPath();
    g.moveTo(cx - R, cy); g.lineTo(cx + R, cy);
    g.moveTo(cx, cy - R); g.lineTo(cx, cy + R);
    g.stroke();
    g.fillStyle = tok("--text-muted");
    g.font = '10px system-ui, -apple-system, "Segoe UI", sans-serif';
    g.textAlign = "right"; g.textBaseline = "top";
    g.fillText(ANGLE_MAX + "°", cx + R - 2, cy + 2);
    g.textAlign = "center"; g.textBaseline = "top";
    g.fillText("vpřed", cx, 1);
    if (hasCmd) {                                             // zadany: kroužek + sipka
      const c1 = px(rc, pc);
      g.strokeStyle = tok("--series-2"); g.lineWidth = 2; g.lineCap = "round";
      g.beginPath(); g.moveTo(cx, cy); g.lineTo(c1.x, c1.y); g.stroke();
      g.beginPath(); g.arc(c1.x, c1.y, 5, 0, 7); g.stroke();
    }
    const a1 = px(ra, pa);                                    // skutecny: plny bod
    g.fillStyle = tok("--series-1");
    g.beginPath(); g.arc(a1.x, a1.y, 4, 0, 7); g.fill();
    g.fillStyle = tok("--text-muted");
    g.beginPath(); g.arc(cx, cy, 1.5, 0, 7); g.fill();
  }
}

class StickPad {
  constructor() {
    const c = document.createElement("section");
    c.className = "card";
    c.innerHTML = '<h2>Páky</h2><p class="sub">Poloha kniplů — vlevo throttle/yaw, vpravo roll/pitch</p>'
      + '<div class="inst-body" style="gap:16px">'
      + '<canvas width="92" height="92" style="width:92px;height:92px"></canvas>'
      + '<canvas width="92" height="92" style="width:92px;height:92px"></canvas>'
      + '<div class="readout"><div>Throttle <b class="thr">—</b> %</div><div>Yaw <b class="yaw">—</b> %</div>'
      + '<div>Roll <b class="rol">—</b> %</div><div>Pitch <b class="pit">—</b> %</div></div></div>';
    this.el = c;
    const cvs = c.querySelectorAll("canvas");
    this.cvL = cvs[0]; this.cvR = cvs[1];
    this.thr = c.querySelector(".thr"); this.yaw = c.querySelector(".yaw");
    this.rol = c.querySelector(".rol"); this.pit = c.querySelector(".pit");
  }
  pad(cv, xVal, yVal) {
    const {g, w, h} = fitCanvas(cv);
    const P = 4, s = Math.min(w, h) - P * 2, x0 = (w - s) / 2, y0 = (h - s) / 2;
    g.strokeStyle = tok("--axis"); g.lineWidth = 1; g.strokeRect(x0, y0, s, s);
    g.strokeStyle = tok("--grid");
    g.beginPath();
    g.moveTo(x0 + s / 2, y0); g.lineTo(x0 + s / 2, y0 + s);
    g.moveTo(x0, y0 + s / 2); g.lineTo(x0 + s, y0 + s / 2);
    g.stroke();
    const cl = v => Math.max(-100, Math.min(100, v == null ? 0 : v));
    const dx = x0 + s / 2 + cl(xVal) / 100 * (s / 2);
    const dy = y0 + s / 2 - cl(yVal) / 100 * (s / 2);
    g.fillStyle = tok("--series-2"); g.beginPath(); g.arc(dx, dy, 5, 0, 7); g.fill();
  }
  draw() {
    const thr = val("cmd_thr"), yaw = val("cmd_yaw"), rol = val("cmd_roll"), pit = val("cmd_pitch");
    this.thr.textContent = fmt(thr, 0); this.yaw.textContent = fmt(yaw, 0);
    this.rol.textContent = fmt(rol, 0); this.pit.textContent = fmt(pit, 0);
    this.pad(this.cvL, yaw, thr);   // vlevo: x = vyboceni, y = plyn
    this.pad(this.cvR, rol, pit);   // vpravo: x = naklon, y = sklon
  }
}

/* ============== naklon dronu (3D): zadane vs skutecne ============== */
class DroneTilt {
  constructor() {
    const c = document.createElement("section");
    c.className = "card";
    c.innerHTML = '<h2>Náklon dronu</h2><p class="sub">Nahoře přes sebe, dole vedle sebe. Přední plné motory = nos.</p>'
      + '<div class="inst-body" style="flex-direction:column;align-items:stretch;gap:12px">'
      +   '<div style="display:flex;gap:14px;align-items:center">'
      +     '<canvas class="ov" width="180" height="150" style="width:180px;height:150px"></canvas>'
      +     '<div class="readout"><div>Roll <b class="r">—</b>°</div><div>Pitch <b class="p">—</b>°</div>'
      +       '<div style="margin-top:6px;color:var(--series-2)">Zadané</div>'
      +       '<div>Roll <b class="cr">—</b>° · Pitch <b class="cp">—</b>°</div></div>'
      +   '</div>'
      +   '<div style="display:flex;gap:18px;justify-content:center">'
      +     '<div style="text-align:center"><canvas class="cmd" width="120" height="106" style="width:120px;height:106px"></canvas>'
      +       '<div class="sub" style="margin:2px 0 0;color:var(--series-2)">zadané</div></div>'
      +     '<div style="text-align:center"><canvas class="act" width="120" height="106" style="width:120px;height:106px"></canvas>'
      +       '<div class="sub" style="margin:2px 0 0;color:var(--series-1)">skutečné</div></div>'
      +   '</div>'
      + '</div>';
    this.el = c;
    this.ov = c.querySelector(".ov"); this.cmdCv = c.querySelector(".cmd"); this.actCv = c.querySelector(".act");
    this.r = c.querySelector(".r"); this.p = c.querySelector(".p");
    this.cr = c.querySelector(".cr"); this.cp = c.querySelector(".cp");
  }
  geom(rollDeg, pitchDeg, cx, cy, scale) {
    // konvence: +roll = pravy bok dolu, +pitch = nos nahoru
    const roll = -rollDeg * Math.PI / 180, pitch = -pitchDeg * Math.PI / 180;
    const cp = Math.cos(pitch), sp = Math.sin(pitch), cr = Math.cos(roll), sr = Math.sin(roll);
    const rot = (bx, by) => { const x = bx * cp, z = -bx * sp; return {x, y: by * cr - z * sr, z: by * sr + z * cr}; };
    const proj = q => ({x: cx + q.y * scale, y: cy - q.x * scale * 0.5 - q.z * scale * 0.9});
    const d = 1;
    return {
      corners: [rot(d, -d), rot(d, d), rot(-d, d), rot(-d, -d)].map(proj),  // FL, FR, RR, RL
      nose: proj(rot(1.7, 0)),
      O: proj({x: 0, y: 0, z: 0}),
      up: proj({x: sp, y: -cp * sr, z: cp * cr}),
    };
  }
  poly(g, pts) { g.beginPath(); pts.forEach((q, i) => i ? g.lineTo(q.x, q.y) : g.moveTo(q.x, q.y)); g.closePath(); }
  quad(g, geo, color, ghost) {
    g.strokeStyle = color; g.fillStyle = color; g.lineCap = "round";
    g.globalAlpha = ghost ? 0.9 : 1;
    // ramena
    g.lineWidth = ghost ? 1.6 : 2.4;
    g.setLineDash(ghost ? [4, 4] : []);
    geo.corners.forEach(pt => { g.beginPath(); g.moveTo(geo.O.x, geo.O.y); g.lineTo(pt.x, pt.y); g.stroke(); });
    g.setLineDash([]);
    // motory: predni dva (index 0,1) vybarvene, zadni obrys
    geo.corners.forEach((pt, i) => {
      const rad = ghost ? 4.5 : 5.5;
      g.beginPath(); g.arc(pt.x, pt.y, rad, 0, 7);
      if (i < 2) { g.fill(); } else { g.lineWidth = ghost ? 1.6 : 2.2; g.stroke(); }
    });
    // vektor tahu (kam se naklani)
    g.globalAlpha = ghost ? 0.55 : 0.8; g.lineWidth = ghost ? 1.4 : 2;
    g.beginPath(); g.moveTo(geo.O.x, geo.O.y); g.lineTo(geo.up.x, geo.up.y); g.stroke();
    g.globalAlpha = 1;
  }
  render(cv, items) {
    const {g, w, h} = fitCanvas(cv);
    const cx = w / 2, cy = h / 2 + h * 0.04, scale = Math.min(w, h) * 0.30;
    g.strokeStyle = tok("--grid"); g.lineWidth = 1;
    g.beginPath(); g.ellipse(cx, cy + scale * 0.2, scale * 1.25, scale * 0.5, 0, 0, 7); g.stroke();
    items.forEach(it => this.quad(g, this.geom(it.roll, it.pitch, cx, cy, scale), it.color, it.ghost));
  }
  draw() {
    const r = val("Roll_deg") ?? 0, p = val("Ptch_deg") ?? 0;
    const cR = val("cmd_roll_deg"), cP = val("cmd_pitch_deg");
    const hasCmd = cR != null && cP != null;
    this.r.textContent = fmt(r, 1); this.p.textContent = fmt(p, 1);
    this.cr.textContent = hasCmd ? fmt(cR, 1) : "—"; this.cp.textContent = hasCmd ? fmt(cP, 1) : "—";
    const s1 = tok("--series-1"), s2 = tok("--series-2");
    // nahore: prekryvajici se (ghost zadane + plne skutecne)
    const ov = [];
    if (hasCmd) ov.push({roll: cR, pitch: cP, color: s2, ghost: true});
    ov.push({roll: r, pitch: p, color: s1, ghost: false});
    this.render(this.ov, ov);
    // dole: vedle sebe, kazdy solo a plne
    this.render(this.cmdCv, hasCmd ? [{roll: cR, pitch: cP, color: s2, ghost: false}] : []);
    this.render(this.actCv, [{roll: r, pitch: p, color: s1, ghost: false}]);
  }
}

/* ================================ kompas =============================== */
class Compass {
  constructor() {
    const c = document.createElement("section");
    c.className = "card";
    c.innerHTML = '<h2>Kurz a rychlost</h2><p class="sub">Směr letu podle GPS</p>'
      + '<div class="inst-body"><canvas width="150" height="150" style="width:150px;height:150px"></canvas>'
      + '<div class="readout"><div>Kurz <b class="h">—</b>°</div><div>Rychlost <b class="s">—</b> km/h</div>'
      + '<div>Stoupání <b class="v">—</b> m/s</div><div>Satelity <b class="n">—</b></div></div></div>';
    this.el = c; this.cv = c.querySelector("canvas");
    this.oh = c.querySelector(".h"); this.os = c.querySelector(".s");
    this.ov = c.querySelector(".v"); this.on = c.querySelector(".n");
  }
  draw() {
    const hdg = val("Hdg") ?? 0;
    this.oh.textContent = fmt(hdg, 0); this.os.textContent = fmt(val("GSpd"), 1);
    this.ov.textContent = fmt(val("VSpd"), 2); this.on.textContent = fmt(val("Sats"), 0);
    const {g, w, h} = fitCanvas(this.cv);
    const cx = w / 2, cy = h / 2, R = Math.min(w, h) / 2 - 4;
    g.strokeStyle = tok("--grid"); g.lineWidth = 1;
    g.beginPath(); g.arc(cx, cy, R, 0, 7); g.stroke();
    g.font = '11px system-ui, -apple-system, "Segoe UI", sans-serif';
    g.textAlign = "center"; g.textBaseline = "middle";
    ["S", "V", "J", "Z"].forEach((lab, i) => {
      const a = i * Math.PI / 2 - Math.PI / 2;
      g.fillStyle = tok("--text-muted");
      g.fillText(lab, cx + Math.cos(a) * (R - 18), cy + Math.sin(a) * (R - 18));
    });
    g.lineWidth = 1;
    for (let d = 0; d < 360; d += 30) {                       // rysky po 30°
      const a = d * Math.PI / 180 - Math.PI / 2;
      const r1 = R - 2, r2 = R - (d % 90 ? 6 : 9);
      g.strokeStyle = d % 90 ? tok("--axis") : tok("--text-muted");
      g.beginPath();
      g.moveTo(cx + Math.cos(a) * r1, cy + Math.sin(a) * r1);
      g.lineTo(cx + Math.cos(a) * r2, cy + Math.sin(a) * r2);
      g.stroke();
    }
    const a = hdg * Math.PI / 180 - Math.PI / 2;              // strelka
    g.strokeStyle = tok("--series-1"); g.lineWidth = 2; g.lineCap = "round";
    g.beginPath();
    g.moveTo(cx - Math.cos(a) * R * 0.28, cy - Math.sin(a) * R * 0.28);
    g.lineTo(cx + Math.cos(a) * R * 0.66, cy + Math.sin(a) * R * 0.66);
    g.stroke();
    g.beginPath(); g.arc(cx, cy, 3, 0, 7); g.fillStyle = tok("--series-1"); g.fill();
  }
}

/* ================================= mapa ================================ */
class TrackMap {
  constructor() {
    const c = document.createElement("section");
    c.className = "card";
    c.innerHTML = '<h2>Stopa letu</h2><p class="sub" id="mapSub">Bez GPS fixu</p>'
      + '<canvas style="width:100%;height:180px;display:block"></canvas>';
    this.el = c; this.cv = c.querySelector("canvas"); this.sub = c.querySelector(".sub");
  }
  draw() {
    const {g, w, h} = fitCanvas(this.cv);
    const pts = windowed()
      .filter(d => typeof d.lat === "number" && typeof d.lon === "number" && (d.lat || d.lon))
      .map(d => ({lat: d.lat, lon: d.lon}));
    if (pts.length < 2) {
      this.sub.textContent = "Bez GPS fixu";
      g.fillStyle = tok("--text-muted");
      g.font = '12px system-ui, -apple-system, "Segoe UI", sans-serif';
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText("čekám na souřadnice", w / 2, h / 2);
      return;
    }
    const last = pts[pts.length - 1];
    this.sub.textContent = `${last.lat.toFixed(6)}, ${last.lon.toFixed(6)} — ${pts.length} bodů`;
    const kx = Math.cos(last.lat * Math.PI / 180);            // stejne meritko v obou osach
    const xs = pts.map(p => p.lon * kx), ys = pts.map(p => p.lat);
    let x0 = Math.min(...xs), x1 = Math.max(...xs), y0 = Math.min(...ys), y1 = Math.max(...ys);
    const sp = Math.max(x1 - x0, y1 - y0, 1e-6) * 1.15;
    const mx = (x0 + x1) / 2, my = (y0 + y1) / 2;
    const P = 14, size = Math.min(w, h) - P * 2;
    const X = x => w / 2 + ((x - mx) / sp) * size;
    const Y = y => h / 2 - ((y - my) / sp) * size;
    g.lineWidth = 2; g.lineJoin = "round"; g.lineCap = "round";
    g.strokeStyle = tok("--series-1");
    g.beginPath();
    pts.forEach((p, i) => { const x = X(p.lon * kx), y = Y(p.lat); i ? g.lineTo(x, y) : g.moveTo(x, y); });
    g.stroke();
    g.beginPath(); g.arc(X(last.lon * kx), Y(last.lat), 5, 0, 7);
    g.fillStyle = tok("--series-2"); g.fill();
    g.lineWidth = 2; g.strokeStyle = tok("--surface-1"); g.stroke();
  }
}

/* ============================== tabulka ================================ */
function drawTable() {
  if (document.getElementById("tableCard").hidden) return;
  const data = windowed(), body = document.getElementById("tableBody");
  const last = latest();
  body.textContent = "";
  S.keys.filter(k => k !== "_ts" && k !== "pc_time").forEach(k => {
    const m = meta(k);
    const vs = [];
    for (const d of data) { const v = d[k]; if (typeof v === "number" && isFinite(v)) vs.push(v); }
    const tr = document.createElement("tr");
    const cur = typeof last[k] === "number" ? fmt(last[k], m.dec) : "—";
    const cells = vs.length
      ? [m.label + (m.unit ? ` (${m.unit})` : ""), cur, fmt(Math.min(...vs), m.dec),
         fmt(Math.max(...vs), m.dec), fmt(vs.reduce((a, b) => a + b, 0) / vs.length, m.dec), String(vs.length)]
      : [m.label, cur, "—", "—", "—", "0"];
    cells.forEach((txt, i) => {
      const td = document.createElement("td");
      if (i === 1) { const b = document.createElement("b"); b.textContent = txt; td.appendChild(b); }
      else td.textContent = txt;
      tr.appendChild(td);
    });
    body.appendChild(tr);
  });
}

/* ============================== vykreslení ============================= */
let dirty = true;
function render() {
  if (!dirty) return;
  dirty = false;
  tiles.forEach(t => t.draw());
  horizon.draw(); tiltDisc.draw(); stickPad.draw(); droneTilt.draw(); compass.draw(); map.draw();
  charts.forEach(c => c.draw());
  drawTable();

  const n = S.samples.length;
  document.getElementById("mCount").textContent = n.toLocaleString("cs-CZ");
  const win = windowed();
  let rate = 0;
  if (win.length > 1) {
    const dt = win[win.length - 1]._ts - win[0]._ts;
    if (dt > 0) rate = (win.length - 1) / dt;
  }
  document.getElementById("mRate").textContent = fmt(rate, 1);
  const el = n ? S.samples[n - 1]._ts - S.t0 : 0;
  document.getElementById("mElapsed").textContent =
    Math.floor(el / 60) + ":" + String(Math.floor(el % 60)).padStart(2, "0");
}
setInterval(render, 200);
window.addEventListener("resize", () => { dirty = true; });

/* =============================== spojení =============================== */
function setStatus(state, text) {
  const s = document.getElementById("status");
  s.dataset.state = state;
  document.getElementById("statusText").textContent = text;
}

function ingest(list) {
  if (S.paused) return;
  const R2D = 180 / Math.PI;
  for (const d of list) {
    if (typeof d._ts !== "number") d._ts = Date.now() / 1000;
    // odvozene kanaly: skutecna attitude ve stupnich + zadane (packy) ve stupnich
    if (typeof d.Roll === "number") d.Roll_deg = SIGN_ACT_ROLL  * (ACT_RAD ? d.Roll * R2D : d.Roll);
    if (typeof d.Ptch === "number") d.Ptch_deg = SIGN_ACT_PITCH * (ACT_RAD ? d.Ptch * R2D : d.Ptch);
    if (typeof d.Yaw  === "number") d.Yaw_deg  = (((ACT_RAD ? d.Yaw * R2D : d.Yaw) % 360) + 360) % 360;
    if (typeof d.cmd_roll  === "number") d.cmd_roll_deg  = SIGN_CMD_ROLL  * d.cmd_roll  / 100 * ANGLE_MAX;
    if (typeof d.cmd_pitch === "number") d.cmd_pitch_deg = SIGN_CMD_PITCH * d.cmd_pitch / 100 * ANGLE_MAX;
    // chyba sledovani (zadane - skutecne) a celkovy naklon (velikost)
    if (typeof d.cmd_roll_deg  === "number" && typeof d.Roll_deg === "number") d.err_roll  = d.cmd_roll_deg  - d.Roll_deg;
    if (typeof d.cmd_pitch_deg === "number" && typeof d.Ptch_deg === "number") d.err_pitch = d.cmd_pitch_deg - d.Ptch_deg;
    if (typeof d.Roll_deg === "number" && typeof d.Ptch_deg === "number") d.tilt_act = Math.hypot(d.Roll_deg, d.Ptch_deg);
    if (typeof d.cmd_roll_deg === "number" && typeof d.cmd_pitch_deg === "number") d.tilt_cmd = Math.hypot(d.cmd_roll_deg, d.cmd_pitch_deg);
    S.samples.push(d);
    for (const k in d) if (!S.keys.includes(k)) S.keys.push(k);
  }
  if (S.samples.length && !S.t0) S.t0 = S.samples[0]._ts;
  if (S.samples.length > 200000) S.samples.splice(0, S.samples.length - 200000);
  S.lastRx = Date.now();
  dirty = true;
}

function connect() {
  const es = new EventSource("/stream");
  es.addEventListener("init", e => {
    const d = JSON.parse(e.data);
    S.samples = []; S.t0 = 0;
    ingest(d.samples);
    setStatus(d.samples.length ? "live" : "wait",
      d.samples.length ? "Připojeno" : "Čekám na data…");
  });
  es.addEventListener("data", e => {
    ingest(JSON.parse(e.data).samples);
    setStatus("live", S.paused ? "Pozastaveno (data běží dál)" : "Připojeno");
  });
  es.onerror = () => {
    setStatus("down", "Spojení přerušeno — zkouším znovu");
    es.close();
    setTimeout(connect, 1500);
  };
}
connect();

// ticho na lince delsi nez 3 s = nic nechodi
setInterval(() => {
  if (S.lastRx && Date.now() - S.lastRx > 3000 && document.getElementById("status").dataset.state === "live")
    setStatus("wait", "Bez dat déle než 3 s");
}, 1000);

/* ============================== ovládání =============================== */
document.querySelectorAll("[data-win]").forEach(b => b.addEventListener("click", () => {
  document.querySelectorAll("[data-win]").forEach(o => o.setAttribute("aria-pressed", String(o === b)));
  S.window = Number(b.dataset.win);
  dirty = true;
}));
document.getElementById("btnPause").addEventListener("click", e => {
  S.paused = !S.paused;
  // u --replay tohle na serveru skutecne zastavi postup prehravanim;
  // pri zivem prijmu ze serioveho portu je to no-op a zaznam bezi dal
  fetch("/pause?on=" + (S.paused ? "1" : "0")).catch(() => {});
  e.target.setAttribute("aria-pressed", String(S.paused));
  e.target.textContent = S.paused ? "Pokračovat" : "Pozastavit";
});
document.getElementById("btnTable").addEventListener("click", e => {
  const card = document.getElementById("tableCard");
  card.hidden = !card.hidden;
  e.target.setAttribute("aria-pressed", String(!card.hidden));
  dirty = true;
});
document.getElementById("btnTheme").addEventListener("click", () => {
  const dark = matchMedia("(prefers-color-scheme: dark)").matches;
  const cur = document.documentElement.dataset.theme || (dark ? "dark" : "light");
  document.documentElement.dataset.theme = cur === "dark" ? "light" : "dark";
  dirty = true;
});
